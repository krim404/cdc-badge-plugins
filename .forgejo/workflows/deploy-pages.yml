name: Deploy Codeberg Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  BINARYEN_VERSION: version_119

jobs:
  deploy:
    runs-on: codeberg-medium

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Rust (wasm32) and wasm-opt
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --target wasm32-unknown-unknown
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          curl -L "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz
          sudo cp "binaryen-${BINARYEN_VERSION}/bin/wasm-opt" /usr/local/bin/

      - name: Build all plugins
        run: ./tools/build_all.sh

      - name: Resolve version tag
        id: version
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          VERSION="${GIT_REF#refs/tags/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Assemble pages content
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p _site/dist
          cp -r webflasher/* _site/
          cp dist/*.wasm dist/*.meta.json _site/dist/
          if ls dist/*.lang.json >/dev/null 2>&1; then cp dist/*.lang.json _site/dist/; fi
          python3 tools/generate_catalog.py \
            --release-base-url "./dist" \
            --version "${TAG}" \
            --out _site/catalog.json

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: 'https://${{ forge.repository_owner }}.codeberg.page/cdc-badge-plugins/'
          token: ${{ forge.token }}
          source: _site/
