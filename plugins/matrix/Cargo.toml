[package]
name = "matrix"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

# vodozemac needs std, so this crate is a std crate (unlike the no_std example
# plugins). cdc-badge-plugin is pulled with default-features off so its dlmalloc
# global allocator and panic handler are dropped; std provides both.
[dependencies]
cdc-badge-plugin = { path = "../../sdk/cdc-badge-plugin", default-features = false }
serde      = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# `insecure-pk-encryption` gates PkDecryption, needed to read the Megolm key
# backup (m.megolm_backup.v1.curve25519-aes-sha2). The "insecure" label is about
# the PK *encryption* primitive; decrypting an existing backup is the standard use.
vodozemac  = { version = "0.10.0", features = ["insecure-pk-encryption"] }
# AES-256-CTR for the SSSS (secret storage) unwrap of the key-backup private
# key; the host AES binding is GCM-only.
aes        = "0.9"
ctr        = "0.10"

# Native test builds link stand-ins for the `host_*` crypto imports
# (see src/host_test_stubs.rs).
[dev-dependencies]
base64 = "0.23"
hmac   = "0.13"
sha2   = "0.11"

# Only the wasm build needs the custom getrandom backend wired to the host RNG;
# native test builds use the OS backend that vodozemac's getrandom picks itself.
# The major must stay the one vodozemac resolves (0.2 via rand_core 0.6): the
# backend is registered per major, so a mismatch leaves vodozemac's getrandom
# without an entropy source on wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }
