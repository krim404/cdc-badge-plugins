name: Deploy GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BINARYEN_VERSION: version_119

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-opt
        run: |
          set -euo pipefail
          curl -L "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz
          sudo cp "binaryen-${BINARYEN_VERSION}/bin/wasm-opt" /usr/local/bin/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$GIT_REF" == refs/tags/* ]]; then
            TAG="${GIT_REF#refs/tags/}"
          else
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
            [ -z "$TAG" ] || [ "$TAG" = "null" ] && TAG="v0.0.0-dev"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build all plugins
        run: ./tools/build_all.sh

      - name: Assemble Pages site
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p _site/dist
          cp -r webflasher/* _site/
          cp dist/*.wasm dist/*.meta.json _site/dist/
          if compgen -G "dist/*.lang.json" > /dev/null; then
            cp dist/*.lang.json _site/dist/
          fi
          python3 tools/generate_catalog.py \
            --release-base-url "./dist" \
            --version "${TAG}" \
            --out _site/catalog.json

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
