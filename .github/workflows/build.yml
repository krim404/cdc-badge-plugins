name: Build Plugins

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  BINARYEN_VERSION: version_119

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-opt
        run: |
          set -euo pipefail
          curl -L "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz
          sudo cp "binaryen-${BINARYEN_VERSION}/bin/wasm-opt" /usr/local/bin/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Build all plugins
        run: ./tools/build_all.sh

      - name: Size check
        run: |
          set -euo pipefail
          for w in dist/*.wasm; do
            size=$(wc -c < "$w")
            echo "$w: $size bytes"
            if [ "$size" -gt 786432 ]; then
              echo "::error::$w exceeds 768 KB limit ($size bytes)"
              exit 1
            fi
          done

      - name: Upload artefacts
        uses: actions/upload-artifact@v7
        with:
          name: plugins
          path: dist/
          retention-days: 30
