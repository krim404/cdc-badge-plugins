name: PR Validation

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Validate every meta.json
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for m in examples/**/meta.json plugins/**/meta.json sdk/**/meta.json; do
            python3 tools/validate_manifest.py "$m"
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # matrix is a std crate (vodozemac); building it together with the
      # no_std plugins leaks std into them (duplicate panic_impl), so it gets
      # its own invocation, as in tools/build_all.sh.
      - name: cargo clippy
        run: |
          cargo clippy --lib --workspace --exclude matrix --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --lib -p matrix --target wasm32-unknown-unknown -- -D warnings

      - name: cargo build
        run: |
          cargo build --release --workspace --exclude matrix --target wasm32-unknown-unknown
          cargo build --release -p matrix --target wasm32-unknown-unknown
