[package]
name = "my_plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
cdc-badge-plugin = { git = "https://github.com/krim404/cdc-badge-plugins", features = ["panic_handler"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
